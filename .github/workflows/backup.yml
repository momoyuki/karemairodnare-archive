name: Backup API

on:
  workflow_dispatch:
  schedule:
    - cron: "17 1 * * *"

permissions:
  contents: write

concurrency:
  group: karemairodnare-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Mirror API
        run: python scripts/backup.py

      - name: Commit changed data
        shell: bash
        run: |
          if git diff --quiet -- api backup-manifest.json && [ -z "$(git status --porcelain -- api backup-manifest.json)" ]; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api backup-manifest.json
          git commit -m "backup: update API snapshot $(date -u +'%Y-%m-%d')"
          git push
